{{- if and (eq .Values.config.source "configMap") .Values.config.files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myco.fullname" . }}-config
  labels:
    {{- include "myco.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Values.config.files }}
  {{ include "myco.configKey" $path }}: {{ $content | quote }}
  {{- end }}
{{- end }}
