# Pack for acme_crm.py. Every @tool method needs exactly one label here.
pack: acme_crm
version: "1"
description: Example CRM pack.

tools:
  list_deals:
    action: deal:list
    sensitive_fields: { finance: [margin] }
  get_deal:
    action: deal:read
    sensitive_fields: { finance: [margin] }
  move_deal: deal:update

roles:
  reader: [deal:read, deal:list]
  sales: [deal:read, deal:list, deal:update]
